# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
  - "@strapi/*"
  # security maintenance

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true
sharedWorkspaceLockfile: false
autoDedupe: true
dedupePeers: true

# node version
engineStrict: true
ignorePnpmfile: true

# Security
lockfile:
  includeResolutionSettings: true
audit:
  level: high
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

allowBuilds:
  '@apollo/protobufjs': false
  "@parcel/watcher": false
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  sharp: false


# broken strapi peers
peerDependencyRules:
  allowedVersions:
    codemirror: 5.65.21
    webpack: 5.109.2

overrides:
  webpack-dev-middleware@<7.4.5: ^7.4.5
