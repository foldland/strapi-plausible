# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
  - "@strapi/*"
  # security maintenance
  - "@vue/compiler-core@3.5.44"
  - "@vue/shared@3.5.44"

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io/

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true
autoDedupe: true
dedupePeers: true

# node version
engineStrict: true
ignorePnpmfile: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

allowBuilds:
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  sharp: false


# broken strapi peers
peerDependencyRules:
  allowedVersions:
    codemirror: 5.65.21

overrides:
  nodemailer@<=10.0.5: ^10.0.6
  webpack-dev-middleware@<7.4.5: ^7.4.5
